<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lisbon, Plant-Powered — a vegan food map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F2E7;
    --paper-deep:#EFE7D6;
    --ink:#1E2B20;
    --forest:#2C5233;
    --azulejo:#25566F;
    --terracotta:#BE5A34;
    --line:#D8CDB2;
    --score-5:#2C6B3F;
    --score-4:#6E8F3E;
    --score-3:#C39A2E;
    --score-2:#D4802F;
    --score-1:#B2452F;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:'DM Sans', sans-serif;
  }

  .app{
    display:grid;
    grid-template-columns: 360px 1fr;
    height:100vh;
    width:100vw;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--paper);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }

  .sidebar-header{
    padding:28px 26px 18px;
    border-bottom:1px solid var(--line);
    background:
      linear-gradient(180deg, var(--paper) 0%, var(--paper) 100%);
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--azulejo);
    font-weight:700;
    margin:0 0 6px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:30px;
    line-height:1.08;
    margin:0 0 8px;
    color:var(--forest);
  }

  h1 em{
    font-style:italic;
    font-weight:500;
    color:var(--terracotta);
  }

  .sub{
    font-size:13.5px;
    color:#5b5346;
    line-height:1.5;
    margin:0;
  }

  .count-line{
    margin-top:14px;
    font-size:12.5px;
    color:var(--forest);
    font-weight:700;
    letter-spacing:.02em;
  }

  /* ---------- Controls ---------- */
  .controls{
    padding:18px 26px;
    border-bottom:1px solid var(--line);
    overflow-y:auto;
  }

  .search-wrap{
    position:relative;
    margin-bottom:20px;
  }

  #search{
    width:100%;
    padding:10px 14px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#fff;
    font-family:'DM Sans', sans-serif;
    font-size:13.5px;
    color:var(--ink);
    outline:none;
  }
  #search:focus{ border-color:var(--azulejo); }

  .group{ margin-bottom:20px; }

  .group-title{
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    font-weight:700;
    color:var(--forest);
    margin:0 0 10px;
  }

  .score-legend{
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .score-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 8px;
    border-radius:7px;
    cursor:pointer;
    user-select:none;
    transition:background .15s ease;
    font-size:13px;
  }
  .score-row:hover{ background:var(--paper-deep); }
  .score-row.off{ opacity:.35; }

  .dot{
    width:13px; height:13px;
    border-radius:50%;
    flex:0 0 auto;
    box-shadow: 0 0 0 2px #fff, 0 0 0 3px rgba(0,0,0,.08);
  }

  .score-label b{ font-weight:700; }
  .score-count{
    margin-left:auto;
    font-size:11.5px;
    color:#8a8071;
    font-variant-numeric: tabular-nums;
  }

  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
  }

  .chip{
    padding:6px 12px;
    border-radius:20px;
    border:1px solid var(--line);
    background:#fff;
    font-size:12.5px;
    cursor:pointer;
    color:#5b5346;
    transition:all .15s ease;
  }
  .chip.active{
    background:var(--forest);
    border-color:var(--forest);
    color:#fff;
  }

  .reset-link{
    background:none;
    border:none;
    color:var(--terracotta);
    font-size:12.5px;
    cursor:pointer;
    padding:0;
    text-decoration:underline;
    text-underline-offset:3px;
    font-family:'DM Sans', sans-serif;
  }

  /* ---------- List ---------- */
  .list-wrap{
    flex:1;
    overflow-y:auto;
    padding:6px 14px 24px;
  }

  .place-card{
    background:#fff;
    border:1px solid var(--line);
    border-left:4px solid var(--score-5);
    border-radius:9px;
    padding:12px 14px;
    margin:8px 12px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .place-card:hover{
    transform:translateY(-1px);
    box-shadow:0 4px 14px rgba(44,82,51,.12);
  }
  .place-card.hidden{ display:none; }
  .place-card.selected{
    background:var(--paper-deep);
  }

  .place-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15.5px;
    color:var(--forest);
    margin:0 0 4px;
  }

  .place-meta{
    font-size:12px;
    color:#7c7361;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
  }

  .price-tag{
    font-weight:700;
    color:var(--azulejo);
  }

  /* ---------- Map ---------- */
  #map{
    height:100%;
    width:100%;
  }

  .leaflet-popup-content-wrapper{
    border-radius:12px;
    font-family:'DM Sans', sans-serif;
    background:var(--paper);
  }

  .popup{ min-width:230px; }
  .popup h3{
    font-family:'Fraunces', serif;
    font-size:17px;
    margin:0 0 6px;
    color:var(--forest);
  }
  .popup .badge{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
    margin-bottom:8px;
  }
  .popup .row{
    font-size:12.5px;
    color:#4a4438;
    margin:4px 0;
    line-height:1.45;
  }
  .popup .row b{ color:var(--ink); }
  .popup .notes{
    font-style:italic;
    color:#7c7361;
  }
  .popup a.gmap{
    display:inline-block;
    margin-top:10px;
    font-size:12px;
    font-weight:700;
    color:#fff;
    background:var(--azulejo);
    padding:7px 12px;
    border-radius:7px;
    text-decoration:none;
  }

  /* scrollbars */
  .list-wrap::-webkit-scrollbar, .controls::-webkit-scrollbar{ width:7px; }
  .list-wrap::-webkit-scrollbar-thumb, .controls::-webkit-scrollbar-thumb{
    background:var(--line); border-radius:4px;
  }

  @media (max-width: 820px){
    .app{ grid-template-columns: 1fr; grid-template-rows: 48vh 52vh; }
    .sidebar{ border-right:none; border-bottom:1px solid var(--line); }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <p class="eyebrow">A field guide</p>
      <h1>Lisbon, <em>plant&#8209;powered</em></h1>
      <p class="sub">Every vegan-friendly stop worth the walk — tagged by how vegan it really is, from all-in kitchens to the one-dish wonders.</p>
      <p class="count-line"><span id="visible-count">27</span> of 27 spots shown</p>
    </div>

    <div class="controls">
      <div class="search-wrap">
        <input id="search" type="text" placeholder="Search by name or dish…" />
      </div>

      <div class="group">
        <p class="group-title">Vegan score</p>
        <div class="score-legend" id="score-legend"></div>
      </div>

      <div class="group">
        <p class="group-title">Price</p>
        <div class="chip-row" id="price-chips"></div>
      </div>

      <button class="reset-link" id="reset-btn">Reset filters</button>
    </div>

    <div class="list-wrap" id="list-wrap"></div>
  </aside>

  <main id="map"></main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============================================================
   DATA
   Vegan score key: 5 fully vegan · 4 not but a lot of options
   3 not vegan but a good amount · 2 less than 3 options · 1 only 1 vegan option
   ============================================================ */
const PLACES = [
  {name:"Veganeats Caffe", lat:38.731640, lng:-9.133324, price:"Very cheap", priceTier:1, cuisine:["Breakfast","Lunch","Sandwiches","Sausages"], score:5, notes:"No dinner", address:"R. Cavaleiro de Oliveira 42, 1170-088 Lisboa"},
  {name:"The Green Affair Saldanha", lat:38.735315, lng:-9.144518, price:"Normal", priceTier:2, cuisine:["Burgers","Bowls","Pasta","Ribs"], score:5, notes:"", address:"Av. Duque de Ávila 30 A, 1000-141 Lisboa"},
  {name:"O Jardim da Jujé", lat:38.730745, lng:-9.140177, price:"Cheap", priceTier:1, cuisine:["Breakfast","Coffee","Smoothie","Quiche","Pastry"], score:5, notes:"No dinner", address:"R. Alexandre Braga 26C, 1150-004 Lisboa"},
  {name:"Gal Café", lat:38.725950, lng:-9.134076, price:"Cheap", priceTier:1, cuisine:["Breakfast","Tofu scramble","Banoffee cake","Sandwiches","Burgers"], score:5, notes:"No dinner", address:"Rua do Forno do Tijolo 54A, 1170-172 Lisboa"},
  {name:"Moko Vegan Bakery", lat:38.734258, lng:-9.150820, price:"Very cheap", priceTier:1, cuisine:["Pastry","Empanadas","Sandwich"], score:5, notes:"No dinner", address:"R. Pinheiro Chagas 69B, 1050-137 Lisboa"},
  {name:"Alfarroba", lat:38.731695, lng:-9.148818, price:"Cheap", priceTier:1, cuisine:["Burger","Cakes","Dish of the day"], score:3, notes:"No dinner", address:"R. Tomás Ribeiro 28, 1050-227 Lisboa"},
  {name:"Legumi Sushi Vegan", lat:38.708631, lng:-9.155649, price:"Expensive", priceTier:4, cuisine:["Sushi","Asian starters","Asian food"], score:5, notes:"", address:"R. Vicente Borga 75, 1200-863 Lisboa"},
  {name:"Honest Greens", lat:38.710221, lng:-9.140397, price:"Cheap", priceTier:1, cuisine:["Toast","Bowls","Desserts","Protein bowls","Plates"], score:3, notes:"Multiple locations around the city", address:"R. Ivens 44, 1200-445 Lisboa"},
  {name:"Kong — food made with compassion", lat:38.707424, lng:-9.142361, price:"Normal–Pricey", priceTier:3, cuisine:["Seafood","Portuguese food"], score:5, notes:"Looks very nice; a bit fancy", address:"Rua do Corpo Santo 2, 1200-129 Lisboa"},
  {name:"Ao 26", lat:38.710231, lng:-9.143997, price:"Normal–Pricey", priceTier:3, cuisine:["Portuguese food","Fish","Steak"], score:5, notes:"Looks very nice", address:"R. da Horta Seca 5, 1200-213 Lisboa"},
  {name:"Vegan Nata Chiado", lat:38.711055, lng:-9.143043, price:"Very cheap", priceTier:1, cuisine:["Pastel de nata","Portuguese food"], score:5, notes:"", address:"R. da Misericórdia 9, 1200-208 Lisboa"},
  {name:"Organi Chiado", lat:38.710297, lng:-9.139716, price:"Normal", priceTier:2, cuisine:["Burger","Pasta","Lasagna","Chana masala","Vegan cheese cuts","Nachos"], score:5, notes:"They have everything", address:"Calçada Nova de São Francisco 2, 1200-300 Lisboa"},
  {name:"The Botanical Den", lat:38.713318, lng:-9.145168, price:"Normal", priceTier:2, cuisine:["Hot dogs","Burgers"], score:5, notes:"Cocktail bar with food", address:"R. da Atalaia 153, 1200-039 Lisboa"},
  {name:"Vegan Buffet", lat:38.711446, lng:-9.140309, price:"Normal", priceTier:2, cuisine:["Buffet"], score:5, notes:"All-you-can-eat, they have everything", address:"Calçada do Sacramento 36, 1200-394 Lisboa"},
  {name:"Plant Base", lat:38.712449, lng:-9.141519, price:"Normal", priceTier:2, cuisine:["Pizza","Burgers","Nachos","Mac n cheese"], score:5, notes:"", address:"R. da Oliveira ao Carmo 9, 1200-307 Lisboa"},
  {name:"If If If", lat:38.719950, lng:-9.151112, price:"Normal", priceTier:2, cuisine:["Snacks","Apperitivo"], score:2, notes:"Georgian wine bar", address:"R. do Salitre 122b, 1250-203 Lisboa"},
  {name:"Os Tibetanos", lat:38.719741, lng:-9.148729, price:"Normal", priceTier:2, cuisine:["Curries","Noodles","Steaks","Tibetan cuisine"], score:4, notes:"", address:"R. do Salitre 117, 1250-198 Lisboa"},
  {name:"Hygge Café", lat:38.731541, lng:-9.149072, price:"Cheap", priceTier:1, cuisine:["Brunch","Wraps","Pancakes"], score:3, notes:"", address:"R. Tomás Ribeiro 95B, 1050-227 Lisboa"},
  {name:"A Minha Avó", lat:38.731104, lng:-9.150981, price:"Normal", priceTier:2, cuisine:["Portuguese food","Steaks","Seafood","Sandwiches","Desserts"], score:5, notes:"", address:"Av. António Augusto de Aguiar 74B, 1050-016 Lisboa"},
  {name:"O Gambuzino", lat:38.721684, lng:-9.134817, price:"Pricey", priceTier:3, cuisine:["Fancier food"], score:5, notes:"Tasting menu available", address:"Rua dos Anjos 5A, 1150-032 Lisboa"},
  {name:"Vegan Sushi House", lat:38.744340, lng:-9.178845, price:"Pricey", priceTier:3, cuisine:["Sushi","Asian starters","Poke bowl"], score:5, notes:"", address:"Estr. de Benfica 331A, 1500-075 Lisboa"},
  {name:"Vegan Junkies", lat:38.724582, lng:-9.143543, price:"Normal", priceTier:2, cuisine:["Burgers","Desserts"], score:5, notes:"", address:"R. Luciano Cordeiro 28, 1150-300 Lisboa"},
  {name:"Santa Marta", lat:38.725335, lng:-9.147057, price:"Normal", priceTier:2, cuisine:["Pizza"], score:1, notes:"Close to hotel; for a lazy day", address:"R. de Santa Marta 61, 1150-294 Lisboa"},
  {name:"Tre Bambu", lat:38.719739, lng:-9.146331, price:"Normal", priceTier:2, cuisine:["Asian food"], score:3, notes:"Nice outdoor area; close to hotel", address:"R. do Salitre 38, 1250-144 Lisboa"},
  {name:"Al Sanpietrino Trattoria", lat:38.712434, lng:-9.125964, price:"Normal", priceTier:2, cuisine:["Italian food","Pasta","Seafood","Lasagna"], score:5, notes:"", address:"Beco da Lapa 31, 1100-331 Lisboa"},
  {name:"Atelier AK", lat:38.721964, lng:-9.145210, price:"Cheap", priceTier:1, cuisine:["Desserts","Croissants"], score:2, notes:"", address:"R. de Santa Marta 19B, 1150-299 Lisboa"},
  {name:"The Food Temple", lat:38.715899, lng:-9.134262, price:"Normal", priceTier:2, cuisine:["Focaccia","Italian food","Tacos"], score:5, notes:"Tasting menu available", address:"Beco do Jasmim 18, 1100-289 Lisboa"}
];

const SCORE_META = {
  5:{label:"Fully vegan", color:"#2C6B3F"},
  4:{label:"Not vegan, but tons of options", color:"#6E8F3E"},
  3:{label:"Not vegan, good amount", color:"#C39A2E"},
  2:{label:"Fewer than 3 options", color:"#D4802F"},
  1:{label:"Only one vegan option", color:"#B2452F"}
};

const PRICE_ORDER = ["Very cheap","Cheap","Normal","Normal–Pricey","Pricey","Expensive"];

/* ============================================================
   STATE
   ============================================================ */
let activeScores = new Set([1,2,3,4,5]);
let activePriceTiers = new Set([1,2,3,4]);
let searchTerm = "";
let markers = {};
let selectedName = null;

/* ============================================================
   MAP INIT
   ============================================================ */
const map = L.map('map', { zoomControl:true }).setView([38.7223, -9.1420], 13);

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
}).addTo(map);

function makeIcon(score, isSelected){
  const color = SCORE_META[score].color;
  const size = isSelected ? 30 : 22;
  return L.divIcon({
    className: '',
    html: `<div style="
      width:${size}px;height:${size}px;border-radius:50%;
      background:${color};
      border:2.5px solid #fff;
      box-shadow:0 2px 6px rgba(0,0,0,.35);
      display:flex;align-items:center;justify-content:center;
      font-family:'DM Sans',sans-serif;font-weight:700;color:#fff;font-size:${isSelected?12:10}px;
      transition:all .15s ease;
    ">${score}</div>`,
    iconSize:[size,size],
    iconAnchor:[size/2,size/2],
    popupAnchor:[0,-size/2]
  });
}

function gmapLink(p){
  const q = encodeURIComponent(p.name + ", " + p.address);
  return `https://www.google.com/maps/search/?api=1&query=${q}`;
}

PLACES.forEach(p => {
  const marker = L.marker([p.lat, p.lng], { icon: makeIcon(p.score,false) });
  marker.bindPopup(`
    <div class="popup">
      <span class="badge" style="background:${SCORE_META[p.score].color}">${p.score}/5 · ${SCORE_META[p.score].label}</span>
      <h3>${p.name}</h3>
      <div class="row"><b>Price:</b> ${p.price}</div>
      <div class="row"><b>Food:</b> ${p.cuisine.join(", ")}</div>
      ${p.notes ? `<div class="row notes">${p.notes}</div>` : ""}
      <a class="gmap" href="${gmapLink(p)}" target="_blank" rel="noopener">Open in Google Maps →</a>
    </div>
  `);
  marker.on('click', () => selectPlace(p.name, false));
  marker.addTo(map);
  markers[p.name] = marker;
});

/* ============================================================
   SIDEBAR — legend, chips, list
   ============================================================ */
const legendEl = document.getElementById('score-legend');
[5,4,3,2,1].forEach(score => {
  const count = PLACES.filter(p => p.score === score).length;
  const row = document.createElement('div');
  row.className = 'score-row';
  row.dataset.score = score;
  row.innerHTML = `
    <span class="dot" style="background:${SCORE_META[score].color}"></span>
    <span class="score-label"><b>${score}</b> — ${SCORE_META[score].label}</span>
    <span class="score-count">${count}</span>
  `;
  row.addEventListener('click', () => {
    if (activeScores.has(score)) { activeScores.delete(score); row.classList.add('off'); }
    else { activeScores.add(score); row.classList.remove('off'); }
    applyFilters();
  });
  legendEl.appendChild(row);
});

const priceChipsEl = document.getElementById('price-chips');
const tierLabels = {1:"Cheap", 2:"Normal", 3:"Pricey", 4:"Expensive"};
[1,2,3,4].forEach(tier => {
  const chip = document.createElement('button');
  chip.className = 'chip active';
  chip.textContent = tierLabels[tier];
  chip.addEventListener('click', () => {
    if (activePriceTiers.has(tier)) { activePriceTiers.delete(tier); chip.classList.remove('active'); }
    else { activePriceTiers.add(tier); chip.classList.add('active'); }
    applyFilters();
  });
  priceChipsEl.appendChild(chip);
});

document.getElementById('reset-btn').addEventListener('click', () => {
  activeScores = new Set([1,2,3,4,5]);
  activePriceTiers = new Set([1,2,3,4]);
  searchTerm = "";
  document.getElementById('search').value = "";
  document.querySelectorAll('.score-row').forEach(r => r.classList.remove('off'));
  document.querySelectorAll('.chip').forEach(c => c.classList.add('active'));
  applyFilters();
});

document.getElementById('search').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  applyFilters();
});

const listWrap = document.getElementById('list-wrap');
PLACES.forEach(p => {
  const card = document.createElement('div');
  card.className = 'place-card';
  card.dataset.name = p.name;
  card.style.borderLeftColor = SCORE_META[p.score].color;
  card.innerHTML = `
    <p class="place-name">${p.name}</p>
    <div class="place-meta">
      <span class="price-tag">${p.price}</span>
      <span>· ${p.cuisine.slice(0,2).join(", ")}</span>
    </div>
  `;
  card.addEventListener('click', () => selectPlace(p.name, true));
  listWrap.appendChild(card);
});

function selectPlace(name, flyTo){
  selectedName = name;
  document.querySelectorAll('.place-card').forEach(c => {
    c.classList.toggle('selected', c.dataset.name === name);
  });
  const p = PLACES.find(x => x.name === name);
  Object.entries(markers).forEach(([n, m]) => m.setIcon(makeIcon(PLACES.find(x=>x.name===n).score, n===name)));
  if (flyTo) {
    map.flyTo([p.lat, p.lng], 16, { duration: 0.6 });
    markers[name].openPopup();
  }
}

function applyFilters(){
  let visible = 0;
  PLACES.forEach(p => {
    const matchesScore = activeScores.has(p.score);
    const matchesPrice = activePriceTiers.has(p.priceTier);
    const matchesSearch = !searchTerm ||
      p.name.toLowerCase().includes(searchTerm) ||
      p.cuisine.join(" ").toLowerCase().includes(searchTerm);
    const show = matchesScore && matchesPrice && matchesSearch;

    const marker = markers[p.name];
    if (show) { if(!map.hasLayer(marker)) marker.addTo(map); visible++; }
    else { if(map.hasLayer(marker)) map.removeLayer(marker); }

    const card = document.querySelector(`.place-card[data-name="${CSS.escape(p.name)}"]`);
    card.classList.toggle('hidden', !show);
  });
  document.getElementById('visible-count').textContent = visible;
}
</script>
</body>
</html>
